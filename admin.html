<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage Services Images</title>
<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<!-- Custom Admin CSS -->
<link href="admin-style.css" rel="stylesheet" />
</head>
<body>

    <!-- Top Bar -->
    <div class="admin-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
        <i class="bi bi-images text-primary fs-4"></i>
        <h4 class="mb-0 fw-bold">Services Image Manager</h4>
        </div>
        <a href="index.html" target="_blank" class="btn btn-sm btn-outline-light">
        <i class="bi bi-box-arrow-up-right me-1"></i>View Live Website
        </a>
    </div>

    <div class="container" style="max-width: 750px;">
        <!-- Status Alert -->
        <div id="statusAlert" class="alert alert-success py-2 small d-none"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
        <p class="text-muted small mb-0">Update, add, or remove the square service images displayed on your homepage.</p>
        <button type="button" class="btn btn-primary btn-sm fw-semibold" id="addServiceBtn">
            <i class="bi bi-plus-lg me-1"></i>Add New Image Box
        </button>
        </div>

        <!-- Dynamic Service Image List -->
        <div id="servicesEditorContainer"></div>

        <!-- Save Button -->
        <div class="d-flex justify-content-end mt-4 pt-3 border-top">
        <button type="button" class="btn btn-success px-4 py-2 fw-semibold" id="saveBtn">
            <i class="bi bi-check-circle-fill me-1"></i>Save & Update Website
        </button>
        </div>
    </div>

    <!-- Custom Admin JS -->
    <script src="admin-script.js"></script>
</body>
</html>
